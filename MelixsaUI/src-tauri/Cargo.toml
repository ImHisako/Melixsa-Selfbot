[package]
name = "melixsa-ui"
version = "0.1.0"
description = "Melixsa Desktop"
authors = ["Melixsa"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
